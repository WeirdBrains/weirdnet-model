name: CI
on:
  push:
    branches: [main]
  pull_request:
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo test --locked --no-default-features --features agent
      # llama.cpp builds from source (cmake and g++ ship on the runner). Vulkan and Metal are not built here.
      - run: cargo clippy --locked --all-targets --features llama,agent -- -D warnings
      - run: cargo test --locked --features llama,agent
      - run: RUSTDOCFLAGS='-D warnings' cargo doc --locked --no-deps --features llama,agent
      # While Cargo.toml patches in an unreleased Weirdnet crate from git, the packaged crate
      # can't build against crates.io yet: check the package contents without the verify build.
      - run: if grep -q '^\[patch' Cargo.toml; then cargo package --locked --no-verify; else cargo package --locked; fi
  cpu-dispatch:
    # ggml built for every CPU level as shared libraries (slow: one CPU library per level).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # Rust 1.100's build-dir layout (target/debug/build/<pkg>/<hash>/out) breaks
      # llama-cpp-sys-2 0.1.161's dynamic-link build script, which finds the target dir three
      # levels above OUT_DIR. Stay on 1.99 (the crate's rust-version) until it is fixed upstream.
      - uses: dtolnay/rust-toolchain@1.99
        with:
          components: clippy
      - run: cargo clippy --locked --all-targets --features cpu-dispatch,agent -- -D warnings
      # llama-cpp-sys-2 0.1.161 hard-links its .so symlinks into the target dir and fails with
      # "File exists" when a second build finds them dangling; remove them between builds.
      - run: find target/debug -maxdepth 2 -xtype l -name 'lib*.so*' -delete
      - run: cargo test --locked --features cpu-dispatch,agent
